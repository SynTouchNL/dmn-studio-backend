name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-jvm:
    name: Build and Push JVM Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Extract metadata (tags, labels)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "IMAGE_TAG=${VERSION}" >> $GITHUB_OUTPUT
            echo "Building version: ${VERSION}"
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "Building latest from main branch"
          fi

      - name: Build and push JVM image with Jib
        env:
          QUARKUS_CONTAINER_IMAGE_REGISTRY: ${{ env.REGISTRY }}
          QUARKUS_CONTAINER_IMAGE_GROUP: ${{ github.repository_owner }}
          QUARKUS_CONTAINER_IMAGE_NAME: dmn-studio-backend
          QUARKUS_CONTAINER_IMAGE_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          QUARKUS_CONTAINER_IMAGE_PUSH: true
          QUARKUS_CONTAINER_IMAGE_BUILD: true
        run: |
          ./mvnw package -DskipTests \
            -Dquarkus.container-image.registry=${QUARKUS_CONTAINER_IMAGE_REGISTRY} \
            -Dquarkus.container-image.group=${QUARKUS_CONTAINER_IMAGE_GROUP} \
            -Dquarkus.container-image.name=${QUARKUS_CONTAINER_IMAGE_NAME} \
            -Dquarkus.container-image.tag=${QUARKUS_CONTAINER_IMAGE_TAG} \
            -Dquarkus.container-image.username=${QUARKUS_CONTAINER_IMAGE_USERNAME} \
            -Dquarkus.container-image.password=${QUARKUS_CONTAINER_IMAGE_PASSWORD} \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.build=true
  build-native:
    name: Build and Push Native Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Extract metadata (tags, labels)
        id: meta
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "IMAGE_TAG=${VERSION}-native" >> $GITHUB_OUTPUT
            echo "Building native version: ${VERSION}"
          else
            echo "IMAGE_TAG=latest-native" >> $GITHUB_OUTPUT
            echo "Building latest-native from main branch"
          fi

      - name: Build native executable
        run: |
          ./mvnw package -Dnative -DskipTests \
            -Dquarkus.native.container-build=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native-micro
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.REPO_OWNER }}/dmn-studio-backend:${{ steps.meta.outputs.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
