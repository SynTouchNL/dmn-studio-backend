quarkus.http.access-log.enabled=true
#server.port=8081
#quarkus.resteasy.json.enabled=true

#POSTGRESQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgrespassword
quarkus.datasource.devservices.port=5432
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus
quarkus.hibernate-orm.schema-management.strategy=update

# Enable CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

#KEYCLOAK
quarkus.oidc.client-id=quarkus-backend
quarkus.oidc.credentials.secret=YsVBOJj2avKCn7erFaNKaWdMmGXbjGgY
quarkus.oidc.tls.verification=none
quarkus.oidc.client.port=8181
quarkus.oidc.auth-server-url=http://localhost:8181/realms/dmn_tool

# REST Client URLs
quarkus.rest-client.keycloak-api.url=http://localhost:8181
quarkus.rest-client.operaton-api.url=http://localhost:8081

# Security Permissions
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit
#quarkus.http.auth.permission.authenticated.policy=authenticated
#quarkus.http.auth.permission.authenticated.paths=/*
quarkus.keycloak.policy-enforcer.enabled=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.jboss.resteasy.reactive".level=DEBUG
quarkus.log.category."io.quarkus.rest.client.reactive".level=DEBUG
quarkus.log.category."nl.syntouch.services.OperatonService".level=DEBUG

