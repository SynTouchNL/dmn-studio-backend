# Test configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Disable OIDC for tests
quarkus.oidc.enabled=false
quarkus.oidc.client-id=dummy
quarkus.oidc.credentials.secret=dummy
quarkus.oidc.auth-server-url=http://localhost:8080/realms/dmn_studio
quarkus.keycloak.policy-enforcer.enabled=false

# Disable security for tests
quarkus.security.users.embedded.enabled=false
quarkus.security.auth.enabled-in-dev-mode=false

# Security Permissions - allow all
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit

quarkus.rest-client.operaton_rest_api_acc.url=http://localhost:8085/engine-rest
quarkus.rest-client.operaton_rest_api_prod.url=http://localhost:8085/engine-rest
quarkus.rest-client.operaton_rest_api_test.url=http://localhost:8085/engine-rest
quarkus.rest-client.operaton_rest_api_ut.url=http://localhost:8085/engine-rest

# Keycloak REST client (dummy URL for tests)
quarkus.rest.client.keycloak-api.url=http://localhost:8080
quarkus.rest.client.keycloak-api.realm=dmn_studio