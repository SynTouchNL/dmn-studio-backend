# Test configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Disable OIDC for tests
quarkus.oidc.enabled=false
quarkus.oidc.credentials.secret=dummy
quarkus.keycloak.policy-enforcer.enabled=false

# Security Permissions
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit

quarkus.rest-client.operaton_rest_api_json.url=http://localhost:8085/engine-rest