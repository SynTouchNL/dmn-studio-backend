services:
  keycloakweb:
    image: quay.io/keycloak/keycloak:26.3.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgrespassword

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8181
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      KC_HTTP_PORT: 8181

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
    depends_on:
      - postgres-keycloak

  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    restart: always

  postgres-dmn-studio:
    image: postgres:15
    container_name: postgres-dmn-studio
    environment:
      - POSTGRES_DB=dmn-studio
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5434:5432"
    volumes:
        - ./postgres:/docker-entrypoint-initdb.d
        - postgres-dmn-studio-data:/var/lib/postgresql/data

  operaton:
    image: operaton/operaton
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres-operaton:5432/operaton
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      WAIT_FOR: postgres-operaton:5432
    ports:
      - "8085:8080"
    depends_on:
      - postgres-operaton

  postgres-operaton:
    image: postgres:15
    container_name: postgres-operaton
    environment:
      - POSTGRES_DB=operaton
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5435:5432"
    volumes:
      - postgres-operaton-data:/var/lib/postgresql/data

volumes:
  postgres-keycloak-data:
    driver: local
  postgres-dmn-studio-data:
    driver: local
  postgres-operaton-data:
    driver: local
